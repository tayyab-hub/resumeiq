[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
    "B008",  # Depends(...) in a default argument is the FastAPI idiom
]

[tool.ruff.lint.per-file-ignores]
# Star-import in this module is deliberate: it registers every table on the
# shared metadata for Alembic's autogenerate.
"alembic/env.py" = ["F403", "F401"]
"tests/conftest.py" = ["E402", "F403", "F401"]
"app/models/__init__.py" = ["F401"]

[tool.coverage.run]
omit = ["tests/*", "alembic/*"]
