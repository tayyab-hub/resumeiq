name: CI

on:
  push:
    branches: [main, codex/resumeiq-portfolio-release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — PostgreSQL, migrations, regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resumeiq
          POSTGRES_PASSWORD: resumeiq
          POSTGRES_DB: resumeiq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resumeiq -d resumeiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: 'false'
      JWT_SECRET: ci-secret-key-that-is-long-enough-for-validation
      AI_API_KEY: ''
      AI_ENABLED_OPT_IN: 'false'
      DATABASE_URL: postgresql+psycopg://resumeiq:resumeiq@localhost:5432/resumeiq_test
      TEST_DATABASE_URL: postgresql+psycopg://resumeiq:resumeiq@localhost:5432/resumeiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: Check formatting
        run: ruff format --check app tests scripts
      - name: Verify migrations on disposable database only
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: PostgreSQL-backed suite with coverage
        run: >-
          pytest --cov=app/analyzers --cov=app/services --cov=app/security
          --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Verify genuine public sample
        run: python -m scripts.export_sample --check
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend — lint, type, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  security:
    name: Security — enforced dependency and secret audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked audit tools
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Audit installed Python runtime and development dependencies
        run: pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Scan tracked files and complete history without printing secrets
        run: python scripts/scan_secrets.py --history

  containers:
    name: Container builds and runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both production images
        run: |
          docker build -t resumeiq-api ./backend
          docker build -t resumeiq-web ./frontend
      - name: Exercise Linux startup, migrations and health
        run: |
          docker run -d --name resumeiq-api-smoke -p 8000:8000 -e ENVIRONMENT=test -e DEBUG=false -e DATABASE_URL=sqlite:////tmp/resumeiq-smoke.db resumeiq-api
          for attempt in $(seq 1 20); do
            if curl --fail http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs resumeiq-api-smoke
          exit 1
